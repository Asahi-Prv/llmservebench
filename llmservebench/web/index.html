<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llmservebench</title>
<link rel="stylesheet" href="vendor/sashimi.default.theme.css">
<link rel="stylesheet" href="vendor/sashimi.bundle.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <div class="brand">
    <h1>llmservebench</h1>
    <p class="sub" data-i18n="app.subtitle">LLM推論バックエンド (OpenAI互換API) のベンチマーク & 比較</p>
  </div>
  <nav class="lang-switch" aria-label="Language">
    <button class="tab-item" data-lang="ja" type="button">JA</button>
    <button class="tab-item" data-lang="en" type="button">EN</button>
  </nav>
</header>

<main>
  <nav class="tabs" aria-label="Mode">
    <button class="tab-item" id="tab-btn-single" type="button" data-i18n="tab.single">単一ベンチ</button>
    <button class="tab-item" id="tab-btn-compare" type="button" data-i18n="tab.compare">バックエンド比較</button>
  </nav>

  <section class="card" id="tab-single">
    <h2 data-i18n="target.title">ターゲット</h2>
    <div class="grid">
      <label class="label"><span data-i18n="label.baseUrl">Base URL</span>
        <input class="input" id="base-url" type="text" value="http://localhost:8080/v1" placeholder="http://localhost:8080/v1">
      </label>
      <label class="label"><span data-i18n="label.model">Model</span>
        <span class="model-row">
          <input class="input" id="model" type="text" list="model-list" placeholder="モデルID">
          <button class="button" id="fetch-models" type="button" data-i18n="fetchModels">取得</button>
        </span>
        <datalist id="model-list"></datalist>
      </label>
      <label class="label"><span data-i18n="label.apiKey">API Key (任意)</span>
        <input class="input" id="api-key" type="password" placeholder="未設定なら空欄" data-i18n-placeholder="label.apiKeyPlaceholder">
      </label>
    </div>
    <div class="actions">
      <button class="button" id="run-single" type="button" data-i18n="run">ベンチマーク実行</button>
      <p class="chip info hidden" id="status-badge" data-i18n="running">実行中...</p>
    </div>
  </section>

  <section class="card hidden" id="tab-compare">
    <h2 data-i18n="compare.title">ターゲット (2つ以上のバックエンドを比較)</h2>
    <div id="compare-rows"></div>
    <div class="actions">
      <button class="button" id="add-target" type="button" data-i18n="compare.addBackend">+ バックエンドを追加</button>
      <button class="button" id="run-compare" type="button" data-i18n="compare.run">比較ベンチ実行</button>
    </div>
  </section>

  <section class="card" id="common-card">
    <h2 data-i18n="common.title">共通設定</h2>
    <div class="grid">
      <label class="label"><span data-i18n="common.parallelLevels">並列数 (カンマ区切り)</span>
        <input class="input" id="parallel-levels" type="text" value="1,2,4,8">
      </label>
      <label class="label"><span data-i18n="common.maxTokens">max tokens</span>
        <input class="input" id="max-tokens" type="number" value="256" min="1">
      </label>
      <label class="label"><span data-i18n="common.runs">実行回数 (runs)</span>
        <input class="input" id="runs" type="number" value="5" min="1">
      </label>
      <label class="label"><span data-i18n="common.parallelRuns">並列テスト回数</span>
        <input class="input" id="parallel-runs" type="number" value="3" min="1">
      </label>
      <label class="label"><span data-i18n="common.prefillTokens">prefill目標トークン数</span>
        <input class="input" id="prefill-tokens" type="number" value="2048" min="64">
      </label>
      <label class="label"><span data-i18n="common.temperature">temperature (任意)</span>
        <input class="input" id="temperature" type="number" step="0.1" placeholder="未指定" data-i18n-placeholder="common.temperaturePlaceholder">
      </label>
      <label class="label"><span data-i18n="common.seed">seed (任意)</span>
        <input class="input" id="seed" type="number" placeholder="未指定" data-i18n-placeholder="common.seedPlaceholder">
      </label>
      <label class="label">
        <span class="check-row"><input class="checkbox" id="warmup" type="checkbox" checked> <span data-i18n="common.warmup">ウォームアップを行う</span></span>
      </label>
      <label class="label">
        <span class="check-row"><input class="checkbox" id="randomize" type="checkbox" checked> <span data-i18n="common.randomize">プロンプトをランダム化 (prefix cache 対策)</span></span>
      </label>
    </div>
  </section>

  <section class="card hidden" id="progress-card">
    <h2 data-i18n="progress.title">進行状況</h2>
    <pre id="log"></pre>
  </section>

  <section class="card hidden" id="result-card">
    <h2 data-i18n="result.title">結果</h2>
    <div id="result-body"></div>
    <div class="actions">
      <button class="button" id="export-json" type="button" data-i18n="export.json">JSON をダウンロード</button>
      <button class="button" id="export-md" type="button" data-i18n="export.md">Markdown をダウンロード</button>
    </div>
  </section>
</main>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
